# nginx TLS-termination reverse proxy for go-Term.
# Place inside /etc/nginx/sites-enabled/ (or `include` it from nginx.conf).
# TLS certificates are managed externally (e.g. certbot / Let's Encrypt).

upstream webssh_go {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssh.example.com;

    ssl_certificate     /etc/letsencrypt/live/ssh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The embedded SPA and REST API are served by the Go binary; proxy all
    # non-websocket traffic straight through.
    location / {
        proxy_pass http://webssh_go;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket terminal endpoint — must forward the Upgrade/Connection headers.
    location /ws {
        proxy_pass http://webssh_go;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
